name: secret-scan

# 密钥扫描：每次 push / PR 都跑一遍，防止将来误提交真实凭据。
# 配置见 .gitleaks.toml（其中加白的只有超星平台的公开协议常量，
# 理由见 docs/密钥与敏感信息说明.md）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 全历史扫描

      - name: 安装 gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: 扫描 git 历史
        run: ./gitleaks git --no-banner --redact --config .gitleaks.toml .

      - name: 熵检测自查（仓库自带）
        run: python3 scripts/scan_secrets.py .
